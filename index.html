<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lelang Barang Kantor</title>

<style>
:root{
  --bg:#f9f8f6;
  --surface:#ffffff;
  --surface2:#f2f1ee;
  --border:rgba(0,0,0,0.09);
  --border2:rgba(0,0,0,0.16);
  --text:#1a1a18;
  --text2:#6b6b67;
  --text3:#a0a09b;

  --green:#0f6e56;
  --green-bg:#e1f5ee;

  --blue:#185fa5;
  --blue-bg:#e6f1fb;

  --amber:#854f0b;
  --amber-bg:#faeeda;

  --red:#a32d2d;
  --red-bg:#fcebeb;

  --radius:12px;
  --radius-sm:7px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* LOGIN */
.login-screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--bg);
  z-index:500;
}

.login-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px 24px;
  width:100%;
  max-width:360px;
}

.login-box h1{
  font-size:22px;
  margin-bottom:6px;
}

.login-box .sub{
  font-size:13px;
  color:var(--text2);
  margin-bottom:20px;
}

.login-box label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:5px;
  color:var(--text2);
}

.login-box input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  margin-bottom:14px;
  background:var(--bg);
  color:var(--text);
}

.login-box button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--blue);
  color:white;
  cursor:pointer;
  font-weight:600;
}

.login-error{
  display:none;
  font-size:12px;
  color:var(--red);
  margin-top:-8px;
  margin-bottom:12px;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.header-left{
  flex:1;
}

.header-title{
  font-size:16px;
  font-weight:700;
}

.header-sub{
  font-size:11px;
  color:var(--text2);
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  display:inline-block;
  margin-right:4px;
  background:#ccc;
}

.online-dot.live{
  background:#1D9E75;
}

.user-chip{
  background:var(--blue-bg);
  color:var(--blue);
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:12px 14px 0;
}

.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px;
}

.stat .lbl{
  font-size:10px;
  color:var(--text2);
}

.stat .val{
  font-size:15px;
  font-weight:700;
  margin-top:3px;
}

/* TOOLBAR */
.toolbar{
  display:flex;
  gap:8px;
  padding:10px 14px;
  flex-wrap:wrap;
}

.toolbar input,
.toolbar select{
  padding:9px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:var(--surface);
}

.toolbar input{
  flex:1;
}

/* ADMIN */
.admin-bar{
  display:none;
  padding:0 14px 8px;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.active-bid-info{
  font-size:12px;
  color:var(--text2);
  padding:6px 10px;
  background:var(--surface2);
  border-radius:var(--radius-sm);
}

/* BUTTON */
.btn{
  padding:8px 13px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
  background:var(--surface);
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.btn-green{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.btn-blue{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.btn-red{
  background:var(--red-bg);
  color:var(--red);
  border-color:var(--red);
}

.btn-amber{
  background:var(--amber-bg);
  color:var(--amber);
  border-color:var(--amber);
}

.btn-ghost{
  background:transparent;
}

.btn:disabled{
  opacity:0.45;
  cursor:not-allowed;
}

/* CARD */
.items{
  padding:0 14px 80px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:13px;
}

.card.my-leading{
  border-color:var(--green);
  background:linear-gradient(135deg,var(--surface),var(--green-bg));
}

.card.won{
  border-color:var(--green);
}

.card-top{
  display:flex;
  gap:8px;
}

.card-num{
  font-size:10px;
  color:var(--text3);
  min-width:18px;
}

.card-body{
  flex:1;
}

.card-name{
  font-size:14px;
  font-weight:700;
}

.card-meta{
  font-size:11px;
  color:var(--text2);
  margin-top:2px;
}

.prices{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:10px;
}

.price-item .lbl{
  font-size:10px;
  color:var(--text3);
}

.price-item .val{
  font-size:13px;
  font-weight:700;
}

.price-item .val.green{
  color:var(--green);
}

.price-item .val.blue{
  color:var(--blue);
}

.bid-row{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}

.bid-row input{
  width:140px;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border2);
}

.bid-history{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.bid-chip{
  font-size:11px;
  background:var(--surface2);
  border-radius:4px;
  padding:2px 7px;
}

.bid-chip.top{
  background:var(--green-bg);
  color:var(--green);
  font-weight:700;
}

.winner-row{
  margin-top:10px;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.winner-name{
  font-weight:700;
  color:var(--green);
}

.bid-limit-notice{
  margin-top:8px;
  font-size:11px;
  color:var(--amber);
  background:var(--amber-bg);
  padding:5px 9px;
  border-radius:var(--radius-sm);
  display:inline-block;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1a1a18;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  opacity:0;
  transition:.2s;
  z-index:999;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
}

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:400;
}

.modal-overlay.open{
  display:flex;
}

.modal{
  background:var(--surface);
  border-radius:var(--radius);
  padding:20px;
  width:100%;
  max-width:400px;
}

.modal h2{
  margin-bottom:10px;
}

.modal p{
  font-size:13px;
  color:var(--text2);
  margin-bottom:12px;
}

.modal input{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  margin-bottom:12px;
}

.modal-btns{
  display:flex;
  gap:8px;
}

.modal-btns .btn{
  flex:1;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>🔨 Lelang Kantor</h1>
    <p class="sub">Masukkan identitasmu</p>

    <label>Nama</label>
    <input type="text" id="login-name" onkeydown="if(event.key==='Enter')doLogin()">

    <label>4 digit terakhir HP</label>
    <input type="text" id="login-phone" maxlength="4" onkeydown="if(event.key==='Enter')doLogin()">

    <div class="login-error" id="login-error">
      Isi nama dan 4 digit nomor HP.
    </div>

    <button onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="header">
  <div class="header-left">
    <div class="header-title">🔨 Lelang Barang Kantor</div>
    <div class="header-sub">
      <span class="online-dot" id="dot"></span>
      <span id="conn-status">Menghubungkan...</span>
    </div>
  </div>

  <span class="user-chip" id="user-chip"></span>

  <button class="btn btn-ghost"
    id="admin-btn"
    onclick="toggleAdmin()"
    style="opacity:.45">
    ⚙️
  </button>
</div>

<div class="stats">
  <div class="stat">
    <div class="lbl">Total</div>
    <div class="val" id="s-total"></div>
  </div>

  <div class="stat">
    <div class="lbl">Terjual</div>
    <div class="val" id="s-sold"></div>
  </div>

  <div class="stat">
    <div class="lbl">Open</div>
    <div class="val" id="s-open"></div>
  </div>

  <div class="stat">
    <div class="lbl">Revenue</div>
    <div class="val" id="s-rev"></div>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="search"
    placeholder="Cari barang..."
    oninput="renderAll()">

  <select id="filter" onchange="renderAll()">
    <option value="all">Semua</option>
    <option value="open">Open</option>
    <option value="won">Terjual</option>
  </select>
</div>

<div class="admin-bar" id="admin-bar">
  <button class="btn btn-red" onclick="resetAll()">
    🗑️ Reset Semua Data
  </button>
  <span class="active-bid-info" id="active-bid-count"></span>
</div>

<div class="items" id="main-list"></div>

<div class="toast" id="toast"></div>

</div>

<!-- ADMIN MODAL -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal">
    <h2>🔐 Login Admin</h2>

    <p>Masukkan password admin</p>

    <input type="password"
      id="admin-pw"
      onkeydown="if(event.key==='Enter')doAdminLogin()">

    <div class="modal-btns">
      <button class="btn btn-green"
        onclick="doAdminLogin()">
        Masuk
      </button>

      <button class="btn"
        onclick="closeModal('admin-modal')">
        Batal
      </button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

/* FIREBASE */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBcxg8EeYMBIJPDVcl82HetvDhkM2gHlR0",
  authDomain: "lelangdilelang-2e8ba.firebaseapp.com",
  databaseURL: "https://lelangdilelang-2e8ba-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lelangdilelang-2e8ba",
  storageBucket: "lelangdilelang-2e8ba.firebasestorage.app",
  messagingSenderId: "938321323861",
  appId: "1:938321323861:web:bbfa095c1464391530f1dc"
};

/* ADMIN — password: lelang2026 */
const ADMIN_HASH = "6c656c616e6732303236";

/* MAX ACTIVE BIDS */
const MAX_ACTIVE_BIDS = 3;

function encodeAdmin(str){
  return Array.from(str)
    .map(c=>c.charCodeAt(0).toString(16))
    .join("");
}

/* ITEMS */
const ITEMS = [
  {id:1, name:"Air Fryer",       merk:"Philips",  bn:1200000, minBid:50000},
  {id:2, name:"Alat Masak Set",  merk:"-",        bn:100000,  minBid:20000},
  {id:3, name:"Boneka",          merk:"-",        bn:200000,  minBid:50000},
  {id:4, name:"Dispenser",       merk:"Klaz",     bn:3000000, minBid:100000},
  {id:5, name:"Dispenser 2",     merk:"Kris",     bn:2500000, minBid:100000},
  {id:6, name:"Kulkas 1",        merk:"Hisense",  bn:1500000, minBid:50000},
  {id:7, name:"Kulkas 2",        merk:"Sharp",    bn:1300000, minBid:50000}
];

let db;
let liveData = {};
let isAdmin = false;
let myName = "";
let myKey  = "";

/* HELPERS */
const fmt = n =>
  "Rp" + Math.round(n || 0).toLocaleString("id-ID");

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.classList.remove("show"); }, 2800);
}

function closeModal(id){
  document.getElementById(id).classList.remove("open");
}

function getState(id){
  return liveData[id] || { bids:{}, winner:null };
}

/* Count items that have at least one bid and are not yet won */
function countActiveBids(){
  return ITEMS.filter(item=>{
    const st = getState(item.id);
    if(st.winner) return false;
    const bids = st.bids ? Object.values(st.bids) : [];
    return bids.length > 0;
  }).length;
}

/* LOGIN USER */
function doLogin(){
  const name  = document.getElementById("login-name").value.trim();
  const phone = document.getElementById("login-phone").value.trim();

  if(!name || !/^\d{4}$/.test(phone)){
    document.getElementById("login-error").style.display = "block";
    return;
  }

  myName = name;
  myKey  = name + "#" + phone;

  document.getElementById("user-chip").textContent = name + " ···" + phone;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";

  initFirebase();
}

/* ADMIN */
function toggleAdmin(){
  document.getElementById("admin-modal").classList.add("open");
}

function doAdminLogin(){
  const val = document.getElementById("admin-pw").value.trim();

  if(encodeAdmin(val) === ADMIN_HASH){
    isAdmin = true;
    closeModal("admin-modal");
    document.getElementById("admin-bar").style.display = "flex";
    document.getElementById("admin-btn").textContent = "🔓";
    document.getElementById("admin-btn").style.opacity = "1";
    toast("Mode admin aktif ✅");
    renderAll();
  } else {
    toast("Password salah ❌");
  }

  document.getElementById("admin-pw").value = "";
}

/* RESET */
function resetAll(){
  if(!isAdmin){ toast("Perlu login admin"); return; }

  const ok = confirm("Reset semua bid dan pemenang?");
  if(!ok) return;

  db.ref("items")
    .remove()
    .then(()=>{
      liveData = {};
      renderAll();
      toast("Semua data berhasil direset 🗑️");
    })
    .catch(()=>{ toast("Gagal reset data"); });
}

/* FIREBASE */
function initFirebase(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();

  db.ref("items").on("value", snap=>{
    liveData = snap.val() || {};
    renderAll();
  });

  db.ref(".info/connected").on("value", snap=>{
    const ok = snap.val();
    document.getElementById("dot").className =
      "online-dot" + (ok ? " live" : "");
    document.getElementById("conn-status").textContent =
      ok ? "Live" : "Offline";
  });
}

/* BID */
function doBid(id){
  const item = ITEMS.find(i=>i.id===id);
  const st   = getState(id);

  if(st.winner){ toast("Item sudah terjual"); return; }

  /* --- RULE: max 3 active bids ---
     An item "activates" a bid slot when it gets its FIRST bid.
     If this item has no bids yet, check the global cap.          */
  const existingBids = st.bids ? Object.values(st.bids) : [];
  const isNewBid     = existingBids.length === 0;

  if(isNewBid && countActiveBids() >= MAX_ACTIVE_BIDS){
    toast(`Maksimal ${MAX_ACTIVE_BIDS} item bisa dibid sekaligus. Tunggu salah satu ditutup dulu 🔒`);
    return;
  }

  const amt = parseInt(
    document.getElementById("ba-"+id).value.replace(/\D/g,"")
  );

  if(!amt){ toast("Nominal tidak valid"); return; }

  const top = existingBids.length
    ? Math.max(...existingBids.map(b=>b.amt))
    : 0;

  const min = top + (item.minBid || 0);

  if(amt < min){ toast("Minimal bid " + fmt(min)); return; }

  db.ref("items/"+id+"/bids").push({
    name: myName,
    key:  myKey,
    amt,
    time: Date.now()
  });

  document.getElementById("ba-"+id).value = "";
  toast("Bid masuk 🎯");
}

/* BUY NOW */
function doBuyNow(id){
  const item = ITEMS.find(i=>i.id===id);
  const st   = getState(id);

  if(st.winner){ toast("Item sudah terjual"); return; }

  /* Same active-bid cap — buy-now also "activates" a slot momentarily,
     but immediately closes it, so we allow it freely.                  */
  db.ref("items/"+id).update({
    winner:      myName,
    winnerKey:   myKey,
    winPrice:    item.bn,
    wonByBuyNow: true
  });

  toast("Buy Now berhasil ⚡");
}

/* FINALIZE — ADMIN ONLY */
function finalizeWinner(id){
  if(!isAdmin){ toast("Hanya admin yang bisa menutup bid ⛔"); return; }

  const st   = getState(id);
  const bids = st.bids ? Object.values(st.bids) : [];

  if(!bids.length){ toast("Belum ada bid untuk item ini"); return; }

  const top = bids.reduce((a,b)=> b.amt > a.amt ? b : a);

  db.ref("items/"+id).update({
    winner:    top.name,
    winnerKey: top.key,
    winPrice:  top.amt
  });

  toast("Pemenang ditentukan ✅");
}

/* RENDER */
function renderAll(){
  let sold=0, open=0, rev=0;

  ITEMS.forEach(item=>{
    const st = getState(item.id);
    if(st.winner){ sold++; rev += st.winPrice || 0; }
    else          { open++; }
  });

  document.getElementById("s-total").textContent = ITEMS.length;
  document.getElementById("s-sold").textContent  = sold;
  document.getElementById("s-open").textContent  = open;
  document.getElementById("s-rev").textContent   = fmt(rev);

  /* Update active-bid counter in admin bar */
  const active = countActiveBids();
  const counter = document.getElementById("active-bid-count");
  if(counter){
    counter.textContent = `Bid aktif: ${active} / ${MAX_ACTIVE_BIDS}`;
  }

  const q   = document.getElementById("search").value.toLowerCase();
  const flt = document.getElementById("filter").value;

  const visible = ITEMS.filter(item=>{
    const st = getState(item.id);
    if(q &&
       !item.name.toLowerCase().includes(q) &&
       !item.merk.toLowerCase().includes(q)
    ) return false;
    if(flt==="open" && st.winner)  return false;
    if(flt==="won"  && !st.winner) return false;
    return true;
  });

  document.getElementById("main-list").innerHTML =
    visible.map(renderCard).join("");
}

function renderCard(item){
  const st   = getState(item.id);
  const bids = st.bids ? Object.values(st.bids) : [];

  bids.sort((a,b)=>a.amt-b.amt);

  const top    = bids.length ? bids[bids.length-1] : null;
  const isWon  = !!st.winner;
  const iAmLeading = top && top.key === myKey;

  /* Is adding a new bid to this item blocked by the cap? */
  const isNewBidItem   = bids.length === 0;
  const activeBidsFull = countActiveBids() >= MAX_ACTIVE_BIDS;
  const blocked        = isNewBidItem && activeBidsFull && !isWon;

  let html = `
  <div class="card ${iAmLeading&&!isWon?'my-leading':''} ${isWon?'won':''}">
    <div class="card-top">
      <div class="card-num">${item.id}</div>
      <div class="card-body">
        <div class="card-name">${item.name}</div>
        <div class="card-meta">${item.merk}</div>
      </div>
    </div>
  `;

  if(!isWon){

    html += `
    <div class="prices">
      <div class="price-item">
        <div class="lbl">Buy Now</div>
        <div class="val blue">${fmt(item.bn)}</div>
      </div>
      <div class="price-item">
        <div class="lbl">Min. Bid</div>
        <div class="val">${fmt(item.minBid)}</div>
      </div>
      <div class="price-item">
        <div class="lbl">Top Bid</div>
        <div class="val green">${top ? fmt(top.amt) : '-'}</div>
      </div>
    </div>

    <div class="bid-row">
      <input
        type="number"
        id="ba-${item.id}"
        placeholder="Nominal bid"
        ${blocked ? 'disabled' : ''}>

      <button
        class="btn btn-green"
        onclick="doBid(${item.id})"
        ${blocked ? 'disabled' : ''}>
        🔨 Bid
      </button>

      <button
        class="btn btn-blue"
        onclick="doBuyNow(${item.id})">
        ⚡ Buy Now
      </button>

      ${isAdmin ? `
      <button
        class="btn btn-amber"
        onclick="finalizeWinner(${item.id})">
        ✅ Tutup
      </button>
      ` : ''}
    </div>

    ${blocked ? `
    <div class="bid-limit-notice">
      ⚠️ Sudah ${MAX_ACTIVE_BIDS} item sedang dibid. Tunggu salah satu ditutup untuk membid item baru.
    </div>
    ` : ''}
    `;

    if(bids.length){
      html += `
      <div class="bid-history">
        ${bids.map((b,i)=>`
          <span class="bid-chip ${i===bids.length-1?'top':''}">
            ${b.name}: ${fmt(b.amt)}
          </span>
        `).join("")}
      </div>
      `;
    }

  } else {

    const howWon = st.wonByBuyNow ? ' (Buy Now)' : '';

    html += `
    <div class="winner-row">
      🏆
      <span class="winner-name">${st.winner}</span>
      <span>${fmt(st.winPrice)}${howWon}</span>
    </div>
    `;
  }

  html += `</div>`;
  return html;
}

</script>
</body>
</html>
